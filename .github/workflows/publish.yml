name: Publicar libro Quarto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Configurar Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restaurar paquetes de R
        uses: r-lib/actions/setup-renv@v2

      - name: Registrar kernel de R
        run: Rscript -e 'IRkernel::installspec()'

      - name: Configurar TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Generar recursos descargables
        run: Rscript scripts/build-notebooks.R

      - name: Renderizar libro
        run: quarto render --profile ci

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
